        'my-account.php': true,
        'my-meetings.php': true,
        'my-photos.php': true,
        'itinerary.php': true,
        'event-photos.php': true,
        'abstract-review.php': true,
        'sponsor-account.php': true,
        'exhibitor-account.php': true,
        'speaker-portal.php': true,

        'live.php': true,
        'networking.php': true,
		'tab-embed.php': true,
		'hotsite-section.php': true,
		'website.php': true
    };

    var currentPage = (window.location.pathname.split('/').pop() || '').toLowerCase();
    if (!allowedPages[currentPage]) {
        return;
    }

    var parentSupportsEmbeddedNavigation = false;

    function handleParentMessage(event) {
        if (event.source !== window.parent) {
            return;
        }

        if (event.origin !== parentOrigin) {
            return;
        }

        if (!event.data || event.data.type !== 'inevent.tabEmbed.ready') {
            return;
        }

        parentSupportsEmbeddedNavigation = true;
    }

    window.addEventListener('message', handleParentMessage);
    window.parent.postMessage({ type: 'inevent.tabEmbed.ping' }, parentOrigin);

    function shouldHandleAnchor(anchor) {
        if (!anchor || !anchor.href) {
            return false;
        }

        if (anchor.hasAttribute('download')) {
            return false;
        }

        var target = (anchor.getAttribute('target') || '').toLowerCase();
        if (target && target !== '_self') {
            return false;
        }

        if (anchor.getAttribute('rel') === 'external') {
            return false;
        }

        var destination;
        try {
            destination = new URL(anchor.href, window.location.href);
        } catch (e) {
            return false;
        }

        var destinationPage = (destination.pathname.split('/').pop() || '').toLowerCase();
        if (destinationPage === 'hotsite-section.php' || destinationPage === 'website.php') {
            return false;
        }

        if (!allowedPages[destinationPage]) {
            return false;
        }

        var currentWithoutHash = window.location.origin + window.location.pathname + window.location.search;
        var destinationWithoutHash = destination.origin + destination.pathname + destination.search;

        // Ignore hash-only jumps, keep them inside the iframe page.
        if (destinationWithoutHash === currentWithoutHash) {
            return false;
        }

        return true;
    }

    function requestParentNavigation(url) {
        window.parent.postMessage({
            type: 'inevent.tabEmbed.navigate',
            href: url
        }, parentOrigin);
    }

    document.addEventListener('click', function (event) {
        if (!parentSupportsEmbeddedNavigation) {
            return;
        }

        if (event.defaultPrevented) {
            return;
        }

        if (event.button !== 0) {
            return;
        }

        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
            return;
        }

        var anchor = event.target.closest ? event.target.closest('a[href]') : null;
        if (!shouldHandleAnchor(anchor)) {
            return;
        }

        event.preventDefault();
        requestParentNavigation(anchor.href);
    }, true);
})();
</script>
